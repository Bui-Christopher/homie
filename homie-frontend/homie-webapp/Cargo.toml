[package]
name = "homie-webapp"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.38", features = ["serde"] }
console_error_panic_hook = "0.1.7"
console_log = { version = "1.0.0", features = ["color"] }
gloo = { version = "0.11.0", default-features = false, features = ["net"] }
leptos = { version = "0.6.15", features = ["csr", "nightly"] }
log = "0.4.22"
plotly = { version = "0.10.0", features = ["wasm"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"

homie-core = { path = "../../homie-backend/homie-core", default-features = false, features = ["wasm"] }
